id: e2e-demo
start: prepare
nodes:
  prepare:
    type: shell
    command: node -e "const fs=require('fs'); fs.writeFileSync('prepare.txt', ['prepare', process.env.FLOWBRAID_RUN_ID, process.env.FLOWBRAID_NODE_ID].join('\n'))"
    next: gate
  gate:
    type: gate
    prompt: "请确认 prepare 阶段已经完成，然后执行 resume"
    next: finish
  finish:
    type: shell
    command: node -e "const fs=require('fs'); fs.writeFileSync('finish.txt', ['finish', process.env.FLOWBRAID_RESUME_COUNT, process.env.FLOWBRAID_NODE_ID].join('\n'))"
    next: done
  done:
    type: end
    message: "e2e-demo 完成"
