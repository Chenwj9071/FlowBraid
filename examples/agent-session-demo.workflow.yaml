id: agent-session-demo
start: discuss
nodes:
  discuss:
    type: agent_session
    provider: codex
    prompt: |
      你现在是一个长期交互开发节点。
      先向用户询问“本次要实现什么”，拿到明确需求后再继续。
      如果信息还不够，请返回 waiting_input。
      如果任务边界已经清楚并给出简短总结，请返回 completed。
    outputFile: turn-result.json
    next: done
  done:
    type: end
    message: 会话完成
