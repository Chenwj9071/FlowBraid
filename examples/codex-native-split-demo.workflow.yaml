id: codex-native-split-demo
workdir: ./demo-workdir
contextDir: ./demo-dev
start: prepare
nodes:
  prepare:
    type: shell
    contextDir: ./demo-workdir
    workdir: ./demo-workdir
    command: >-
      node -e "const fs = require('node:fs');
      for (const name of fs.readdirSync('.')) {
      if (name === 'AGENTS.md' || name === 'doc') continue;
      if (name === 'calc.js' || name === 'feedback-applied.txt' || name === 'README-demo.txt' || name.endsWith('.log')) {
      if (fs.existsSync(name)) fs.rmSync(name, { force: true });
      }
      }"
    next: develop

  develop:
    type: codex
    contextDir: ./demo-dev
    workdir: ./demo-workdir
    prompt: |
      You are the development node. Read AGENTS.md in the current directory first, then implement the task.
      Do the real work inside workdir, not inside the current directory.
      Treat runtime-state plus outcome as the source of truth for node completion.

      Goal:
      1. Create or update calc.js in the current workdir
      2. Accept two CLI numeric arguments a and b
      3. Print only the numeric result of a + b

      Environment requirements:
      - Use Node.js
      - This repository uses ESM. Do not use require, module.exports, or require.main
      - The script must run as: node calc.js 1 2
      - Support positive numbers, negative numbers, and decimals

      Required behavior:
      - Before changing code, explicitly read the current node runtime-state and human feedback when they exist
      - If there is no prior runtime-state yet, you must submit the smallest correct implementation first
      - If there is no prior runtime-state yet, do not add any comments, usage text, or extra explanation inside calc.js
      - The first revision is expected to fail verification because comments are intentionally missing
      - If the latest runtime-state says comments are missing, your next revision must add comments directly in calc.js without changing the correct behavior
      - If the latest human feedback asks for extra explanation, address it after the runtime-state requirements are satisfied
      - Only modify calc.js unless the task explicitly requires something else
      - When you finish, report the result with `flowbraid node complete --attempt-id <current attempt> --outcome ...`
    outputFile: develop-last-message.md
    next: review

  review:
    type: approval
    prompt: |
      这是 develop 完成后的人工审核节点。
      - approve：继续进入 verify 节点做自动化验收
      - reject：回到 develop 节点继续修改
    transitions:
      approve: verify
      reject: develop

  verify:
    type: codex
    contextDir: ./demo-verify
    workdir: ./demo-workdir
    prompt: |
      You are the verification node. Read AGENTS.md in the current directory first, then verify the deliverable.
      Run verification commands inside workdir, not inside the current directory.
      Treat runtime-state plus outcome as the source of truth for node completion.

      You must actually run calc.js in the current workdir.

      Required checks:
      1. node calc.js 1 2 must output 3
      2. node calc.js 10 -4 must output 6
      3. node calc.js 1.5 2.5 must output 4
      4. The script must print only the result value
      5. calc.js must include at least one clear comment explaining the script purpose or the CLI parsing logic

      Decision rules:
      - If behavior is wrong, final outcome must be reject
      - If behavior is correct but comments are missing, final outcome must still be reject
      - Only approve after both behavior and comment requirements are satisfied

      Output requirements:
      - Write the verification report to the node output file
      - If reject, explain the exact failure and the concrete fix, then report `flowbraid node complete --attempt-id <current attempt> --outcome reject`
      - If approve, summarize the commands you ran, the outputs, and the comment check result, then report `flowbraid node complete --attempt-id <current attempt> --outcome approve`
    outputFile: verify-report.md
    transitions:
      success: approve
      failure: develop

  approve:
    type: approval
    prompt: |
      Human confirmation is required before the workflow can end.
      If you reject, you must provide a concrete comment. The workflow will record it and send the task back to develop.
    transitions:
      approve: done
      reject: develop

  done:
    type: end
    message: native split demo completed

